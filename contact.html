<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Lyra Nightshade</title>
<meta name="description" content="Find Lyra Nightshade in-world or get in touch.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow"></div>

<header class="navbar">
  <a class="logo" href="index.html">✦ Lyra<span>.SL</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="avatars.html">Avatars</a>
    <a href="categories.html">Categories</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
</header>

<div class="page-header">
  <p class="eyebrow">Say hello</p>
  <h1>Find Me In-World</h1>
  <p>Reach out through any of these, or send a note below.</p>
</div>

<section class="section">
  <div class="contact-grid">
    <a class="contact-card" href="#">
      <div class="tile-icon">👤</div>
      <h3>Second Life Profile</h3>
      <p>@lyra.nightshade</p>
    </a>
    <a class="contact-card" href="#">
      <div class="tile-icon">💬</div>
      <h3>Discord</h3>
      <p>lyranightshade</p>
    </a>
    <a class="contact-card" href="#">
      <div class="tile-icon">📷</div>
      <h3>Flickr</h3>
      <p>flickr.com/lyra-sl</p>
    </a>
  </div>

  <form class="contact-form glass" id="contactForm">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Send Message</button>
    <p id="formStatus" style="color: var(--text-dim); font-size: 0.9rem;"></p>
  </form>
</section>

<footer>
  <p>&copy; 2026 Lyra Nightshade · Made with ✦ for the grid</p>
</footer>

<script src="script.js"></script>
</body>
</html>
